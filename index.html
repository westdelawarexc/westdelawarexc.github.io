<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>West Delaware Girls Cross Country</title>
<meta name="description" content="West Delaware Hawks girls cross country — this week's practices and meets, schedule, courses, records, training and info for parents and runners.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="West Delaware Girls Cross Country">
<meta property="og:title" content="West Delaware Girls Cross Country">
<meta property="og:description" content="West Delaware Hawks girls cross country — schedule, courses, records, training and info for parents and runners.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
/* ================= HERO: full-bleed photo ================= */
.hero{position:relative;background:#000;color:#fff;overflow:hidden;min-height:min(86vh,720px);display:flex;align-items:flex-end;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 44px),0 100%);margin-bottom:-10px}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.slide .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.42) saturate(1.2);transform:scale(1.1)}
.slide .fg{position:absolute;top:0;right:0;height:100%;width:66%;object-fit:cover;object-position:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.slide.on .fg{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.slide .fg.logo{object-fit:contain;padding:8% 8% 8% 20%}
.slide .cap{position:absolute;right:24px;top:20px;font:600 13px var(--f-cond);letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.75);background:rgba(0,0,0,.4);padding:3px 9px;border-radius:3px}
.shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.7) 32%,rgba(0,0,0,0) 62%),
  linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 40%);pointer-events:none}
/* topo-style contour lines instead of mat stripes */
.stripes{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(ellipse at 10% 120%,transparent 0 22px,rgba(224,78,15,.12) 22px 24px);
  -webkit-mask-image:linear-gradient(90deg,#000 0,transparent 50%);mask-image:linear-gradient(90deg,#000 0,transparent 50%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-top:70px;padding-bottom:84px}
.hero .copy{max-width:600px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:700 15px var(--f-cond);letter-spacing:4px;text-transform:uppercase;color:var(--o)}
.eyebrow:before{content:"";width:34px;height:3px;background:var(--o)}
.hero h1{margin:10px 0 0;font:italic 900 70px/.92 var(--f-head);text-transform:uppercase;letter-spacing:-.5px;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:2px #fff}
.hero h1 em{display:block;font-style:inherit;color:var(--o)}

/* next meet + countdown */
.next{margin-top:26px;background:rgba(17,17,17,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);border-left:5px solid var(--o);border-radius:10px;padding:14px 16px 16px;max-width:520px}
.next .lab{display:flex;align-items:center;gap:8px;font:700 13px var(--f-cond);letter-spacing:2.5px;color:var(--o);text-transform:uppercase}
.next .live{display:none;background:var(--o);color:#fff;border-radius:3px;padding:1px 7px;letter-spacing:1.5px;animation:pulse 1.6s ease-in-out infinite}
.next.is-today .live{display:inline-block}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,78,15,.7)}50%{box-shadow:0 0 0 8px rgba(224,78,15,0)}}
.next h3{margin:4px 0 2px;font:800 23px/1.1 var(--f-head);text-transform:uppercase}
.next p{margin:0;font:500 16px var(--f-cond);color:#ddd;letter-spacing:.5px}
.next p b{color:#fff}
.cd{display:flex;gap:8px;margin:12px 0 4px}
.cd div{min-width:64px;text-align:center;background:#0b0b0b;border:1px solid #2c2c2c;border-radius:6px;padding:6px 4px 4px}
.cd b{display:block;font:800 30px/1 var(--f-head);font-variant-numeric:tabular-nums;color:#fff}
.cd span{font:700 11px var(--f-cond);letter-spacing:1.5px;color:#999;text-transform:uppercase}
.cd div:first-child b{color:var(--o)}
.next .lk a{background:transparent}
.dots{position:absolute;right:24px;bottom:58px;display:flex;gap:7px;z-index:3}
.dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:.3s}
.dots b.on{background:var(--o);width:22px;border-radius:4px}

@media(max-width:860px){
  .hero{min-height:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),0 100%)}
  .slide .fg{width:100%;height:62%;-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 30%);mask-image:linear-gradient(0deg,transparent 0,#000 30%)}
  .slide .fg.logo{padding:10%}
  .slide .cap{right:auto;left:16px;top:12px}
  .shade{background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.85) 42%,rgba(0,0,0,.1) 66%,rgba(0,0,0,.15) 100%)}
  .stripes{-webkit-mask-image:linear-gradient(0deg,#000 0,transparent 55%);mask-image:linear-gradient(0deg,#000 0,transparent 55%)}
  .hero .wrap{padding-top:min(58vh,440px);padding-bottom:56px}
  .hero h1{font-size:46px}
  .dots{right:auto;left:0;right:0;justify-content:center;top:calc(min(58vh,440px) - 34px);bottom:auto}
  .cd div{min-width:0;flex:1}
}
@media(max-width:380px){.hero h1{font-size:38px}}

/* ================= THIS WEEK ================= */
.tw{border:2px solid var(--k);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tw-h{background:var(--k);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-bottom:4px solid var(--o)}
.tw-h .rg{margin-left:auto;font:700 18px var(--f-cond);color:var(--o);letter-spacing:1px}
.tw-h button{background:#2a2a2a;color:#fff;border:0;border-radius:4px;width:34px;height:34px;font:700 18px var(--f-cond);cursor:pointer;transition:.15s}
.tw-h button:hover{background:var(--o)}
.row{display:grid;grid-template-columns:repeat(6,1fr)}
.dy{border-right:1px solid var(--line);padding:8px;min-height:170px;font-size:13px;transition:background .2s}
.dy:last-child{border-right:0}
.dy:hover{background:#fafafa}
.dy .hd{font:700 14px var(--f-cond);letter-spacing:1px;color:#555;margin-bottom:4px}
.dy .hd b{font:700 22px var(--f-cond);color:var(--k);margin-left:4px}
.dy.today{background:var(--tint);box-shadow:inset 0 0 0 2px var(--o)}
.dy.today .hd b{color:var(--o)}
.dy.today .hd:after{content:"TODAY";display:inline-block;margin-left:6px;background:var(--o);color:#fff;font-size:10px;padding:0 4px;border-radius:2px;vertical-align:3px}
.m{background:var(--o);color:#fff;border-radius:4px;padding:5px 6px;margin-top:4px;font:600 14px/1.15 var(--f-cond)}
.m small{display:block;font-weight:500;font-size:13px;opacity:.95}
.m .lk{gap:4px;margin-top:5px}.m .lk a{border-color:#fff;font-size:11px;padding:1px 5px}
.p{background:#ececec;border-left:3px solid var(--g);color:#333;padding:4px 6px;margin-top:4px;font:500 14px/1.2 var(--f-cond)}
.p b{font-weight:700}
.none{color:#999;font:500 14px var(--f-cond);margin-top:4px}
@media(max-width:700px){
  .row{grid-template-columns:1fr}
  .dy{border-right:0;border-bottom:1px solid var(--line);min-height:0;display:flex;gap:12px;padding:10px 12px}
  .dy:last-child{border-bottom:0}
  .dy .hd{min-width:58px;margin:2px 0 0}
  .dy .hd b{display:block;margin:0;font-size:24px;line-height:1}
  .dy.today .hd:after{margin:4px 0 0;display:inline-block}
  .dy>div:last-child{flex:1}
  .m,.p{font-size:15px}
}

/* ================= COMING UP: dark angled band ================= */
.band{position:relative;background:var(--k);color:#fff;margin-top:56px;padding:74px 0 80px;
  clip-path:polygon(0 40px,100% 0,100% calc(100% - 40px),0 100%)}
.band:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(ellipse at 100% 0%,transparent 0 26px,rgba(224,78,15,.07) 26px 28px)}
.band .wrap{position:relative}
.band .sec{color:#fff;margin-top:0}
.band .sec a{color:var(--o)}
.band .lede{margin:-4px 0 18px;color:#aaa;font:500 17px var(--f-cond);letter-spacing:.3px}
.mlist{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mc{display:flex;border:1px solid #2b2b2b;border-radius:8px;overflow:hidden;background:#181818;color:#ddd;transition:transform .2s,box-shadow .2s,border-color .2s}
.mc:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.45);border-color:var(--o)}
.mc .dt{background:linear-gradient(180deg,var(--o),#b83d08);color:#fff;min-width:78px;text-align:center;padding:12px 4px;font-family:var(--f-head)}
.mc .dt span{display:block;font-size:13px;letter-spacing:1.5px;opacity:.9}
.mc .dt b{display:block;font-size:28px;line-height:1.05}
.mc .tx{padding:10px 14px;font-size:14px;line-height:1.45}
.mc h4{margin:0 0 2px;font:700 20px var(--f-cond);color:#fff}
.mc .opp{font:700 15px var(--f-cond);color:var(--o)}.mc .opp span{color:#999;font-weight:500}
.mc .where{color:#aaa}
.mc .tag{background:#333}.mc .tag.hm{background:var(--o)}
.mc .lk a{background:transparent}
/* off-season: course cards */
.crs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cr{display:block;text-decoration:none;color:#ddd;background:#181818;border:1px solid #2b2b2b;border-left:4px solid var(--o);border-radius:8px;padding:12px 14px;transition:transform .2s,border-color .2s}
.cr:hover{transform:translateY(-3px);border-color:var(--o)}
.cr h4{margin:0;font:700 19px/1.15 var(--f-cond);color:#fff}
.cr .v{font:500 14px var(--f-cond);color:#999;letter-spacing:.3px}
.cr .rec{margin-top:6px;font:500 14px var(--f-cond);color:#bbb}
.cr .rec b{font:italic 800 18px var(--f-head);color:var(--o);margin-right:6px}
@media(max-width:700px){.mlist{grid-template-columns:1fr}.band{padding:56px 0 62px;clip-path:polygon(0 24px,100% 0,100% calc(100% - 24px),0 100%)}}

/* calendar chip */
.lk a.cal{border-color:#fff;color:#fff}
.lk a.cal:hover{background:#fff;color:var(--k)}
.mc .lk a.cal{border-color:#666;color:#ddd}
.mc .lk a.cal:hover{background:#fff;color:var(--k);border-color:#fff}

/* ================= FASTEST COURSE RECORDS ================= */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.num{position:relative;border:2px solid var(--k);border-radius:10px;padding:16px 16px 14px;overflow:hidden;background:#fff}
.num:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;background:var(--o);opacity:.08;transform:rotate(45deg)}
.num b{display:block;font:italic 900 52px/1 var(--f-head);color:var(--o);font-variant-numeric:tabular-nums}
.num span{display:block;margin-top:6px;font:700 15px var(--f-cond);letter-spacing:1.5px;text-transform:uppercase;color:var(--k)}
.num small{font:500 14px var(--f-cond);color:#777;letter-spacing:.5px}
@media(max-width:760px){.nums{grid-template-columns:1fr 1fr}.num b{font-size:40px}}

/* quick links */
.ql{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ql a{position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:96px;background:var(--k);color:#fff;text-decoration:none;border-radius:10px;padding:16px 56px 16px 18px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ql a:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--o)}
.ql a:after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);font:700 38px var(--f-cond);color:var(--o);transition:transform .2s}
.ql a:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.25)}
.ql a:hover:after{transform:translate(4px,-50%)}
.ql b{font:800 20px var(--f-head);text-transform:uppercase}
.ql span{font:500 14px var(--f-cond);color:#bbb;letter-spacing:.5px}
@media(max-width:560px){.ql{grid-template-columns:1fr}}

/* coaches */
.co{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cc{border:1px solid var(--line);border-top:4px solid var(--o);border-radius:8px;padding:14px 16px;font:500 15px/1.5 var(--f-cond)}
.cc .r{font:700 13px var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:var(--o)}
.cc h4{margin:2px 0 6px;font:800 22px var(--f-head);text-transform:uppercase}
.cc a{text-decoration:none}
@media(max-width:760px){.co{grid-template-columns:1fr}}

/* ================= reveal on scroll ================= */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.slide.on .fg{animation:none}.next .live{animation:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="tk" id="tk"></div>

<section class="hero">
  <div class="slides" id="slides"></div>
  <div class="shade"></div><div class="stripes"></div>
  <div class="dots" id="dots"></div>
  <div class="wrap">
    <div class="copy">
      <div class="eyebrow">Hawks</div>
      <h1>West Delaware <span>Girls</span><em>Cross Country</em></h1>
      <div class="next" id="next" hidden></div>
    </div>
  </div>
</section>

<main class="wrap" id="weekWrap">
  <div class="sec rv" style="margin-top:44px">This Week</div>
  <div class="tw rv">
    <div class="tw-h"><button id="prev" aria-label="Previous week">‹</button><span class="rg" id="rg"></span><button id="nxt" aria-label="Next week">›</button></div>
    <div class="row" id="row"></div>
  </div>
</main>

<section class="band">
  <div class="wrap" id="band"></div>
</section>

<main class="wrap">
  <div class="sec rv" style="margin-top:44px">Fastest Course Records <a href="records.html">Records ›</a></div>
  <div class="nums" id="nums"></div>

  <div class="sec rv">Quick Links</div>
  <div class="ql rv" id="ql"></div>

  <div class="sec rv">Contact the Coaches</div>
  <div class="co rv" id="co"></div>
  <p class="note-live">Times Central</p>
</main>
<footer class="foot" id="foot"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
/* ---------- Central-time helpers ---------- */
function ctOffsetMin(utcMs){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(utcMs));const g=t=>+p.find(x=>x.type===t).value;return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'))-utcMs)/6e4}
function ctToUtc(y,mo,d,h,mi){const guess=Date.UTC(y,mo,d,h,mi);return guess-ctOffsetMin(guess)*6e4}
function startOf(m){const t=String(m.st).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);if(!t)return null;let h=+t[1]%12;if(/pm/i.test(t[3]))h+=12;return {h,mi:+t[2]}}
function meetUtc(m){const s=startOf(m)||{h:0,mi:0};return ctToUtc(m.d.getFullYear(),m.d.getMonth(),m.d.getDate(),s.h,s.mi)}

/* ---------- Add to calendar ---------- */
function calLink(m){
  const s=startOf(m),pad=n=>String(n).padStart(2,'0');
  const ymd=m.d.getFullYear()+pad(m.d.getMonth()+1)+pad(m.d.getDate());
  const title='WD Girls XC: '+m.ev;
  const det=[m.races,m.note].filter(Boolean).join('\n');
  const loc=m.ad||m.venue;
  if(/android/i.test(navigator.userAgent)){
    let dates;if(s){const st=ymd+'T'+pad(s.h)+pad(s.mi)+'00';const e=new Date(2000,0,1,s.h+2,s.mi);dates=st+'/'+ymd+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'}else{const n=new Date(m.d);n.setDate(n.getDate()+1);dates=ymd+'/'+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate())}
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=America/Chicago&text='+encodeURIComponent(title)+'&dates='+dates+'&location='+encodeURIComponent(loc)+'&details='+encodeURIComponent(det)}
  const e=x=>String(x).replace(/[\\,;]/g,c=>'\\'+c).replace(/\n/g,'\\n');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//West Delaware Girls Cross Country//EN','BEGIN:VEVENT','UID:'+ymd+'-'+encodeURIComponent(m.ev).slice(0,40)+'@wdgirlsxc','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'];
  if(s){const end=new Date(2000,0,1,s.h+2,s.mi);lines.push('DTSTART;TZID=America/Chicago:'+ymd+'T'+pad(s.h)+pad(s.mi)+'00','DTEND;TZID=America/Chicago:'+ymd+'T'+pad(end.getHours())+pad(end.getMinutes())+'00')}
  else{const n=new Date(m.d);n.setDate(n.getDate()+1);lines.push('DTSTART;VALUE=DATE:'+ymd,'DTEND;VALUE=DATE:'+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate()))}
  lines.push('SUMMARY:'+e(title),'LOCATION:'+e(loc),'DESCRIPTION:'+e(det),'END:VEVENT','END:VCALENDAR');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(lines.join('\r\n'));
}
function links(m){let h=meetLinks(m);const c='<a class="cal" href="'+calLink(m)+'" '+(/android/i.test(navigator.userAgent)?'target="_blank" rel="noopener"':'download="'+esc(m.ev).replace(/[^\w ]/g,'')+'.ics"')+'>+ Calendar</a>';
  return h?h.replace('</div>',c+'</div>'):'<div class="lk">'+c+'</div>'}

/* ---------- This Week / Coming Up / Next meet ---------- */
let weekOffset=0,DATA=null;
function renderWeek(){
  const now=todayCT();
  const base=new Date(now);base.setDate(now.getDate()+(now.getDay()===0?1:1-now.getDay())+weekOffset*7);
  const days=[...Array(6)].map((_,i)=>new Date(base.getFullYear(),base.getMonth(),base.getDate()+i));
  document.getElementById('rg').textContent=(days[0].getMonth()+1)+'/'+days[0].getDate()+' – '+(days[5].getMonth()+1)+'/'+days[5].getDate();
  const tk=dkey(now);
  document.getElementById('row').innerHTML=days.map(d=>{const k=dkey(d);let h='';
    (DATA.byM[k]||[]).forEach(m=>{h+='<div class="m">'+esc(m.ev)+'<small>'+esc(m.st)+' · '+esc(m.loc)+'</small>'+meetLinks(m)+'</div>'});
    if(!DATA.byM[k])(DATA.byP[k]||[]).forEach(p=>h+='<div class="p">Practice '+esc(p.t)+(p.l?' · <b>'+esc(p.l)+'</b>':'')+'</div>');
    if(!h)h='<div class="none">No practice</div>';
    return '<div class="dy'+(k===tk?' today':'')+'"><div class="hd">'+DN[d.getDay()]+'<b>'+(d.getMonth()+1)+'/'+d.getDate()+'</b></div><div>'+h+'</div></div>'}).join('');
}
function inSeason(){
  // show "This Week" from 2 weeks before the first practice/meet until the last one
  const all=DATA.meets.map(m=>m.d).concat(DATA.practices.map(p=>p.d));if(!all.length)return false;
  const t=+todayCT(),a=Math.min(...all)-14*864e5,b=Math.max(...all);return t>=a&&t<=b;
}
function courseCards(){
  return '<div class="crs">'+Object.values(XC.COURSES).map(c=>'<a class="cr rv" href="courses.html"><h4>'+esc(c.name)+'</h4><div class="v">'+esc(c.venue)+' · '+esc(c.town)+'</div>'+
    (c.record?'<div class="rec"><b>'+esc(c.record.time)+'</b>'+esc(c.record.name)+' · '+esc(c.record.year)+'</div>':'')+'</a>').join('')+'</div>'}
async function bootSchedule(){
  DATA=await loadSchedule();
  const today=todayCT();
  const up=DATA.meets.filter(m=>m.d>=today);
  if(inSeason())renderWeek();else document.getElementById('weekWrap').hidden=true;
  const band=document.getElementById('band');
  const rest=up.slice(1,7);
  if(rest.length){
    band.innerHTML='<div class="sec rv">Coming Up <a href="schedule.html">Full schedule ›</a></div><div class="mlist">'+rest.map(m=>meetCard(m).replace(meetLinks(m),links(m)).replace('class="mc"','class="mc rv"')).join('')+'</div>';
  }else{
    band.innerHTML='<div class="sec rv">Where We Race <a href="courses.html">Courses &amp; directions ›</a></div><p class="lede rv">Our usual meets, with each course\'s West Delaware 5K record.</p>'+courseCards();
  }
  const el=document.getElementById('next');el.hidden=false;
  const n=up[0];
  if(!n){
    const past=DATA.meets.length&&DATA.meets[DATA.meets.length-1].d<today;
    el.innerHTML='<div class="lab">'+(past?'Season complete':'Off-season')+'</div><h3>'+esc(XC.SEASON)+' schedule coming soon</h3>'+
      '<p>Summer running and meet dates will be posted here. Keep your miles up!</p><div class="lk"><a class="cal" href="training.html">Summer training ›</a><a class="cal" href="history.html">Season history ›</a></div>';
    return}
  const when=DN[n.d.getDay()].charAt(0)+DN[n.d.getDay()].slice(1).toLowerCase()+' '+(n.d.getMonth()+1)+'/'+n.d.getDate();
  el.innerHTML='<div class="lab">Next meet <span class="live">Today</span></div><h3>'+esc(n.ev)+'</h3>'+
    '<p><b>'+esc(when)+' · '+esc(n.st)+'</b> · '+esc(n.venue||n.loc)+'</p>'+
    '<div class="cd" id="cd"><div><b id="cdD">–</b><span>Days</span></div><div><b id="cdH">–</b><span>Hrs</span></div><div><b id="cdM">–</b><span>Min</span></div><div><b id="cdS">–</b><span>Sec</span></div></div>'+links(n);
  const target=meetUtc(n),isToday=dkey(n.d)===dkey(today);
  if(isToday)el.classList.add('is-today');
  const p2=x=>String(x).padStart(2,'0');
  const tick=()=>{let s=Math.max(0,Math.floor((target-Date.now())/1000));
    document.getElementById('cdD').textContent=Math.floor(s/86400);document.getElementById('cdH').textContent=p2(Math.floor(s%86400/3600));
    document.getElementById('cdM').textContent=p2(Math.floor(s%3600/60));document.getElementById('cdS').textContent=p2(s%60);
    if(s===0&&isToday)document.getElementById('cd').outerHTML='<div class="cd"><div style="flex:1"><b style="color:var(--o)">GO HAWKS!</b><span>Racing now</span></div></div>'};
  tick();setInterval(()=>{if(document.getElementById('cdS'))tick()},1000);
}
document.getElementById('prev').onclick=()=>{if(!DATA)return;weekOffset--;renderWeek()};
document.getElementById('nxt').onclick=()=>{if(!DATA)return;weekOffset++;renderWeek()};

/* ---------- static sections ---------- */
const secs=t=>{const m=String(t).match(/(\d+):(\d+)/);return m?+m[1]*60+ +m[2]:9e9};
document.getElementById('nums').innerHTML=Object.values(XC.COURSES).filter(c=>c.record).sort((a,b)=>secs(a.record.time)-secs(b.record.time)).slice(0,4)
  .map(c=>'<div class="num rv"><b>'+esc(c.record.time)+'</b><span>'+esc(c.record.name)+'</span><small>'+esc(c.name)+' · '+esc(c.record.year)+'</small></div>').join('');
document.getElementById('ql').innerHTML=XC.QUICK.map(q=>'<a href="'+esc(q.url)+'"'+ext(q.url)+'><b>'+esc(q.title)+'</b><span>'+esc(q.sub)+'</span></a>').join('');
document.getElementById('co').innerHTML=XC.COACHES.map(c=>'<div class="cc"><div class="r">'+esc(c.role)+'</div><h4>'+esc(c.name)+'</h4>'+
  (c.cell?'Cell: <a href="tel:'+c.cell.replace(/\D/g,'')+'">'+esc(c.cell)+'</a><br>':'')+(c.school?'School: '+esc(c.school)+'<br>':'')+(c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+'</div>').join('');

/* ---------- full-bleed slideshow ---------- */
(async function photos(){
  const box=document.getElementById('slides'),dots=document.getElementById('dots');
  const tryLoad=u=>new Promise(r=>{const im=new Image();const t=setTimeout(()=>r(false),12000);im.onload=()=>{clearTimeout(t);r(true)};im.onerror=()=>{clearTimeout(t);r(false)};im.src=u});
  const list=(XC.PHOTOS||[]).slice();
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  const ss=[],ds=[];let cur=0;
  function show(i){if(!ss.length)return;ss[cur].classList.remove('on');ds[cur]&&ds[cur].classList.remove('on');cur=i;
    const s=ss[cur];s.classList.remove('on');void s.offsetWidth;s.classList.add('on');ds[cur]&&ds[cur].classList.add('on')}
  function add(p,logo){const s=document.createElement('div');s.className='slide';
    s.innerHTML='<div class="bg" style="background-image:url(\''+p.src+'\')"></div><img class="fg'+(logo?' logo':'')+'" alt="'+esc(p.caption||'West Delaware girls cross country')+'" src="'+p.src+'">'+(p.caption&&!logo?'<span class="cap">'+esc(p.caption)+'</span>':'');
    box.appendChild(s);ss.push(s);
    if(!logo){const b=document.createElement('b');b.onclick=()=>show(ss.indexOf(s));dots.appendChild(b);ds.push(b)}
    if(ss.length===1)show(0);dots.style.display=ds.length>1?'':'none'}
  await Promise.all(list.map(async p=>{if(await tryLoad(p.src))add(p)}));
  if(!ss.length){add({src:'img/logo.svg'},true);return}
  setInterval(()=>{if(ss.length>1&&!document.hidden)show((cur+1)%ss.length)},6000);
})();

/* ---------- reveal on scroll ---------- */
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');io.unobserve(e.target)}),{threshold:.15}):null;
function observe(){document.querySelectorAll('.rv:not(.in)').forEach(el=>io?io.observe(el):el.classList.add('in'))}
bootSchedule().then(observe);
observe();
</script>
