<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History · West Delaware Girls Cross Country</title>
<meta name="description" content="West Delaware girls cross country alumni running in college and past season archives.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,700;0,800;1,900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.al{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:6px}
.ac{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ac .yr{background:var(--k);color:#fff;border-bottom:3px solid var(--o);padding:8px 14px;display:flex;align-items:baseline;justify-content:space-between}
.ac .yr b{font:800 20px var(--f-head);text-transform:uppercase}
.ac .yr span{font:700 14px var(--f-cond);letter-spacing:1.5px;color:var(--o)}
.ac .cg{padding:10px 14px 2px;font:700 18px/1.15 var(--f-cond);color:var(--o-dk)}
.ac .sp{padding:2px 14px 12px;font:500 15px var(--f-cond);color:#666}
.ac.next{border:2px dashed var(--line);box-shadow:none;display:flex;align-items:center;justify-content:center;min-height:120px;font:italic 900 24px var(--f-head);color:#bbb;text-transform:uppercase}
.sa{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sa a{display:block;text-align:center;text-decoration:none;background:var(--k);color:#fff;border-bottom:4px solid var(--o);border-radius:6px;padding:14px 4px;font:800 26px var(--f-head);transition:transform .15s}
.sa a:hover{transform:translateY(-3px);background:var(--o);border-color:var(--k)}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="tk" id="tk"></div>
<div class="hdr"><div class="wrap"><h1>History</h1><p>Runners in College · <b>Season Archive</b></p></div></div>

<main class="wrap">
<div class="sec">Runners in College <small>since 2012</small></div>
<div class="al" id="al"></div>
<div class="sec">Season Archive</div>
<p style="font:500 16px var(--f-cond);color:#555;margin:-4px 0 12px">Meet results, award winners and captains for each season (opens the archive).</p>
<div class="sa" id="sa"></div>
</main>
<footer class="foot" id="foot"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
document.getElementById('al').innerHTML=XC.ALUMNI.map(a=>'<div class="ac"><div class="yr"><b>'+esc(a.name)+'</b><span>WD '+esc(a.cls)+'</span></div><div class="cg">'+esc(a.college)+'</div><div class="sp">'+esc(a.sport)+'</div></div>').join('')+'<div class="ac next">Who\'s next?</div>';
document.getElementById('sa').innerHTML=XC.SEASONS.map(([y,u])=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+y+'</a>').join('');
</script>
</body>
</html>
