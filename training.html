<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training · West Delaware Girls Cross Country</title>
<meta name="description" content="Summer, winter and spring workouts, running form, strength routines and nutrition for West Delaware girls cross country runners.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,700;0,800;1,900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.gb h3{margin:0;background:var(--k);color:#fff;border-bottom:3px solid var(--o);font:800 19px var(--f-head);text-transform:uppercase;letter-spacing:.5px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.gb h3 svg{flex:none;color:var(--o)}
.gb ul{list-style:none;margin:0;padding:6px 0}
.gb li a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font:600 17px/1.2 var(--f-cond);border-bottom:1px solid #f0f0f0}
.gb li:last-child a{border-bottom:0}
.gb li a:after{content:"›";color:var(--o);font:700 22px var(--f-cond)}
.gb li a:hover{background:var(--tint);color:var(--o-dk)}
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.bo{border:1px solid var(--line);border-left:6px solid var(--o);border-radius:4px;padding:10px 12px;background:#fff}
.bo b{display:block;font:700 17px/1.15 var(--f-cond)}
.bo span{font:500 14px var(--f-cond);color:#777}
.camp{margin-top:14px;background:var(--k);color:#fff;border-radius:10px;padding:16px 18px;font:500 17px var(--f-cond);border-left:6px solid var(--o)}
.camp b{color:var(--o);font:800 18px var(--f-head);text-transform:uppercase;margin-right:8px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="tk" id="tk"></div>
<div class="hdr"><div class="wrap"><h1>Training</h1><p>Workouts · Form · <b>Strength</b> · Nutrition</p></div></div>

<main class="wrap">
<div class="sec">Workouts &amp; Resources</div>
<div class="grp" id="grp"></div>
<div class="camp" id="camp"></div>
<div class="sec">Recommended Reading</div>
<div class="bk" id="bk"></div>
</main>
<footer class="foot" id="foot"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
const ICON={
 sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 snow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7L4 17M9 3l3 3 3-3M9 21l3-3 3 3"/></svg>',
 leaf:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c0-9 6-15 15-15 0 9-6 15-15 15zM5 20l7-7"/></svg>',
 run:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-4 5 1 3 4M11 15l-1-5"/></svg>',
 brain:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 006 1V5a3 3 0 00-3-1zM15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-6 1"/></svg>',
 bolt:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
 apple:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-2-2-7-1.5-7 4 0 4 3 9 5 9 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-5 5-9 0-5.5-5-6-7-4zM12 7c0-2 1-4 3-4"/></svg>'};
function groups(list,icons){return list.map(g=>'<div class="gb"><h3>'+(icons&&ICON[g.icon]||'')+esc(g.group)+'</h3><ul>'+g.items.map(([t,u])=>'<li><a href="'+esc(u)+'"'+ext(u)+'>'+esc(t)+'</a></li>').join('')+'</ul></div>').join('')}
document.getElementById('grp').innerHTML=groups(XC.TRAINING,true);
document.getElementById('camp').innerHTML='<b>Summer Camps</b>'+esc(XC.CAMPS);
document.getElementById('bk').innerHTML=XC.BOOKS.map(([t,a])=>'<div class="bo"><b>'+esc(t)+'</b><span>'+esc(a)+'</span></div>').join('');
</script>
</body>
</html>
